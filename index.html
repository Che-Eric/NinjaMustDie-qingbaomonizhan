<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情报模拟战 · 网页版</title>
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-sparks" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <main id="app" data-phase="placement">
    <div class="utility">
      <span id="aiBadge" class="util-btn badge-ai">模型加载中…</span>
      <button type="button" id="mute" class="util-btn" title="声音开关" aria-pressed="true"></button>
      <button type="button" id="restart" class="util-btn gold" title="开始新对局">新对局</button>
    </div>
    <div class="topbar">
      <div class="stats left" id="statsLeft"></div>
      <div class="center">
        <div class="roundbanner" id="roundBanner">第 1/5 回合</div>
        <div class="clock" id="clock"></div>
      </div>
      <div class="stats right" id="statsRight"></div>
    </div>
    <div id="timerwrap"><div id="timerbar"></div></div>
    <div id="restbanner" hidden></div>
    <div class="layout" id="layout">
      <section id="left" class="boardframe"></section>
      <section id="right" class="shoppanel"></section>
    </div>
    <p id="message" role="status"></p>
    <div class="shuriken-deco" aria-hidden="true"></div>
  </main>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-shuriken">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M50 0 61 39 100 50 61 61 50 100 39 61 0 50 39 39Z"/><circle cx="50" cy="50" r="9" fill="rgba(0,0,0,.45)"/></svg>
      </div>
      <h2>加载训练模型</h2>
      <div class="boot-bar"><div id="bootFill"></div></div>
      <div class="boot-line"><span id="bootPct">0%</span><span id="bootMB">0.0 / 5.6 MB</span></div>
      <p class="boot-hint">首次打开需下载约 5.6MB 的已训练模型（视网络数秒至数十秒），完成后浏览器会缓存、再次打开秒进。加载完成前不会开始对局，也不会使用任何替代 AI。</p>
      <p id="bootErr" class="boot-err"></p>
      <button type="button" id="bootRetry" class="btn gold" hidden>重试</button>
    </div>
  </div>
  <div id="lookback" class="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-head">
        <h2>上轮阵容回看</h2>
        <button type="button" id="backToPlace" class="btn gold">回到放置</button>
      </div>
      <div class="layout" id="lookbackLayout"></div>
    </div>
  </div>
  <div id="over" class="overlay" hidden>
    <div class="overlay-card narrow">
      <div id="overContent"></div>
      <button type="button" id="overRestart" class="btn gold big">再来一局</button>
    </div>
  </div>
  <script type="module" src="static.mjs"></script>
</body>
</html>
